[project]
name = "matchamomo"
version = "0.1.0"
description = "A TUI-based Pomodoro timer featuring two animated ASCII cats: a large orange cat and a small tortie."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
]

[project.scripts]
matchamomo = "matchamomo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchamomo"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
