[project]
name = "matchamomo"
version = "0.1.0"
description = "A TUI-based Pomodoro timer featuring two animated ASCII cats: a large orange cat and a small tortie."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Roger Allen", email = "roger.allen795@gmail.com" },
]
keywords = ["pomodoro", "timer", "tui", "textual", "cats", "ascii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Hailstone-Labs/MatchaMomo"
Repository = "https://github.com/Hailstone-Labs/MatchaMomo"
Issues = "https://github.com/Hailstone-Labs/MatchaMomo/issues"
Changelog = "https://github.com/Hailstone-Labs/MatchaMomo/blob/main/CHANGELOG.md"

[project.scripts]
matchamomo = "matchamomo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchamomo"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
